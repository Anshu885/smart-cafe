{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h1>Smart Cafe Intelligence System</h1>
    <h2>Login</h2>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
    <p>New customer? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
